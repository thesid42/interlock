services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: interlock
      CLICKHOUSE_USER: interlock
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set a local ClickHouse password before starting}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - interlock-clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  interlock-clickhouse:
